<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login_page</title>
    
    <!-- ಇಲ್ಲಿಂದ ಸ್ಟೈಲ್ ಶುರುವಾಗುತ್ತದೆ (CSS) -->
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f2f5;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }

        h1 {
            color: #333;
            margin-bottom: 20px;
        }

        form {
            background-color: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.1);
            width: 300px;
        }

        label {
            font-weight: bold;
            color: #555;
            display: block; /* ಲೇಬಲ್ ಮತ್ತು ಇನ್ಪುಟ್ ಸರಿಯಾಗಿ ಕೂರಲು */
            margin-bottom: 5px;
        }

        input[type="text"], 
        input[type="password"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box; /* ಪ್ಯಾಡಿಂಗ್ ಆಡ್ ಆದಾಗ ಬಾಕ್ಸ್ ಹೊರಗೆ ಹೋಗದಿರಲು */
        }

        button {
            width: 100%;
            padding: 10px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
        }

        button:hover {
            background-color: #0056b3;
        }

        p {
            color: #d93025;
            background-color: #fce8e6;
            padding: 10px;
            border-radius: 4px;
            border: 1px solid #ea868f;
            font-weight: bold;
            width: 300px;
            text-align: center;
        }
    </style>
    <!-- ಸ್ಟೈಲ್ ಮುಕ್ತಾಯ -->

</head>
<body>

    <h1>Login,welcome back</h1>

    {% if error %}
        <p>{{ error }}</p>
    {% endif %}

    <form method="POST">
        {% csrf_token %}

        <label> Enter Username:</label>
        <input type="text" name="username" required>

        <br><br>

        <label> Enter Password:</label>
        <input type="password" name="password" required>

        <br><br>

        <button type="submit">Login</button>
    </form>

</body>
</html>
